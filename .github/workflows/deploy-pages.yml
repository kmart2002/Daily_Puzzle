# Deploys the site to GitHub Pages:
#   /                  → existing legacy pages (root index.html redirect + web/)
#   /tabletop-trainer/ → the built puzzle app (target of the daily email links)
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main] # repo default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build puzzle app
        working-directory: tabletop-trainer
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/tabletop-trainer
          cp index.html _site/
          cp -r web _site/web
          cp -r tabletop-trainer/dist/. _site/tabletop-trainer/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
